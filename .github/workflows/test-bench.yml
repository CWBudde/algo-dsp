name: Benchmark Guard

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bench-guard:
    name: Benchmark Guard (advisory)
    runs-on: ubuntu-latest
    # Advisory only: wall-clock numbers on shared runners are far too noisy to
    # gate a merge on, and the checked-in baseline is recorded on developer
    # hardware, so benchguard reports ns/op differences without enforcing them.
    # Allocation regressions are machine-independent and do show up as
    # REGRESSED in the job summary.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install just
        uses: extractions/setup-just@v3

      # The benchmark set lives in the justfile so CI and local runs cannot drift.
      - name: Run benchmark subset
        run: just bench-ci 3 | tee bench.txt

      - name: Compare against baseline
        run: |
          {
            echo '### Benchmark guard'
            echo
            echo '```'
            go run ./cmd/benchguard -baseline benchmarks/baseline.json < bench.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload raw benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: bench.txt
          retention-days: 14
