version: "2"

run:
  timeout: 5m

linters:
  # node_modules is frontend tooling for the web demo; some npm packages ship
  # stray .go files that are not ours to lint.
  exclusions:
    paths:
      - node_modules

  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - thelper
    - tparallel
    - unused
    - wsl_v5

    - revive
  settings:
    # varnamelen is intentionally not enabled: this is a numerical DSP library
    # whose short identifiers (M, K, G0, Gb, b0, a1, ...) mirror the reference
    # equations documented alongside the code. varnamelen flagged ~300 such
    # names across the library, which are deliberate rather than unclear.
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 1500
              skip-comments: false
              skip-blank-lines: false
formatters:
  enable:
    - gofmt
