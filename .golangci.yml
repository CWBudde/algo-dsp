version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - thelper
    - tparallel
    - unused
    - varnamelen
    - wsl_v5

    - revive
  settings:
    varnamelen:
      # Idiomatic math/DSP identifiers that are clear despite being short.
      ignore-names:
        - i
        - j
        - k
        - n
        - x
        - y
        - re
        - im
        - in
        - q
        - id
        - b0
        - b1
        - b2
        - a0
        - a1
        - a2
        - d0
        - d1
        - y0
        - y1
        - y2
        - dw
        - i0
        - i1
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 1500
              skip-comments: false
              skip-blank-lines: false
formatters:
  enable:
    - gofmt

issues:
  exclude-use-default: false
